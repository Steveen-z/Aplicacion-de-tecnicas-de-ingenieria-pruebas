# PostgreSQL 16 + PostGIS para desarrollo. La primera vez que se crea el volumen
# ejecuta db/migraciones/*.sql en orden. Con un volumen existente usa
# `npm run db:migrar` (o `docker compose down -v` para empezar de cero).
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: inmobisv-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: plataforma_terrenos
    ports:
      - "5432:5432"
    volumes:
      - inmobisv-pgdata:/var/lib/postgresql/data
      - ./db/migraciones:/docker-entrypoint-initdb.d/migraciones:ro
      - ./db/docker-initdb.sh:/docker-entrypoint-initdb.d/20_migraciones.sh:ro

volumes:
  inmobisv-pgdata:
